<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía ADOO para el final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral fija con navegación + columna de lectura de ~820px. Estética de mesa de dibujo técnico: papel frío, tinta azul marino, un acento cobalto y un color por familia de patrones. */
:root {
  --bg: #eceee9; --paper: #fbfbf8; --ink: #1b2130; --muted: #5a6373; --line: #d3d7cf; --head: #eaeef6;
  --accent: #2545c4; --accent-soft: #e2e8fb;
  --cre: #b0501a; --est: #0e7266; --com: #6a3ccc;
  --ok: #1a7a3c; --ok-soft: #e0f1e5; --bad: #b32424; --bad-soft: #f7e2e2; --mid: #9a6a00;
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141a; --paper: #191d25; --ink: #e4e7ec; --muted: #9aa3b1; --line: #2c323d; --head: #212837;
    --accent: #8099ff; --accent-soft: #232c4b;
    --cre: #f0995a; --est: #3fc2b1; --com: #b195ff;
    --ok: #55d184; --ok-soft: #173525; --bad: #ff7a7a; --bad-soft: #3a1c1f; --mid: #e3b341;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141a; --paper: #191d25; --ink: #e4e7ec; --muted: #9aa3b1; --line: #2c323d; --head: #212837;
  --accent: #8099ff; --accent-soft: #232c4b;
  --cre: #f0995a; --est: #3fc2b1; --com: #b195ff;
  --ok: #55d184; --ok-soft: #173525; --bad: #ff7a7a; --bad-soft: #3a1c1f; --mid: #e3b341;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
code, kbd { font-family: var(--f-mono); font-size: .86em; }
code { background: var(--accent-soft); padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 .35em; background: var(--paper); color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(1.8rem, 3.2vw, 2.5rem); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 1.1rem 0 .35rem; }
h4 { font-size: .95rem; margin-bottom: .3rem; }
p { margin: .4rem 0; }
.muted { color: var(--muted); }
.center { text-align: center; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--paper); padding: 22px 14px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; padding: 0 10px 14px; display: block; color: var(--ink); text-decoration: none; }
.brand small { display: block; font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: .78rem; }
.nav-sec { font: 700 .7rem var(--f-display); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 16px 10px 6px; }
.nav-a { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: .95rem; }
.nav-a:hover { background: var(--accent-soft); }
.nav-a.on { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .nav-a.on { color: #0d1020; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nav-a.on { color: #0d1020; } }
.nav-a span:first-of-type { flex: 1; }
.nav-a .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cat); flex: none; }
.nav-cnt { font: .75rem var(--f-mono); opacity: .75; font-variant-numeric: tabular-nums; }
main { padding: 36px clamp(16px, 4vw, 56px) 80px; max-width: 1180px; width: 100%; }
.lede, .card > p, .def, .note, .confuse, .rel { max-width: 92ch; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: 0; z-index: 5; height: auto; display: flex; gap: 4px; overflow-x: auto; padding: 8px 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand, .nav-sec { display: none; }
  #nav { display: flex; gap: 4px; }
  .nav-a { white-space: nowrap; padding: 6px 10px; font-size: .88rem; }
  .nav-cnt { display: none; }
  main { padding-top: 24px; }
}

.hero, .page-h { margin-bottom: 22px; }
.kicker { font: 700 .75rem var(--f-display); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); margin: 0 0 .5rem; }
.kicker.cat { color: var(--cat); }
.page-h h1 { border-left: 5px solid var(--cat, var(--accent)); padding-left: 14px; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 68ch; margin-top: .6rem; }
.overall { display: flex; align-items: center; gap: 14px; margin-top: 18px; color: var(--muted); font-size: .92rem; flex-wrap: wrap; }
.overall .bar { flex: 1; min-width: 200px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.sm { height: 5px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

.topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 22px; }
.topic { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; padding: 14px 16px; background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--cat, var(--accent)); border-radius: 8px; color: var(--ink); text-decoration: none; }
.topic:hover { border-color: var(--cat, var(--accent)); }
.topic-name { font: 700 .98rem var(--f-display); }
.topic-n { font: .85rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.topic .bar { grid-column: 1 / -1; }
.topic .bar i { background: var(--cat, var(--accent)); }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
.panel, .card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; }
.card { margin-bottom: 18px; min-width: 0; }
.panel h2, .card > h2 { margin-bottom: .6rem; }
.steps { padding-left: 1.2rem; margin: 0; display: grid; gap: .55rem; }
.steps li::marker { font-family: var(--f-mono); color: var(--accent); }

.card-h { display: flex; align-items: flex-start; gap: 14px; margin-bottom: .6rem; flex-wrap: wrap; }
.card-h h2 { margin: 0; }
.grow { flex: 1; min-width: 200px; }
.en { color: var(--muted); font-size: .88rem; margin: .15rem 0 0; }
.got { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px 4px 8px; cursor: pointer; user-select: none; white-space: nowrap; }
.got:has(input:checked) { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.got input { accent-color: var(--ok); margin: 0; }
.letter { font: 800 2.4rem/1 var(--f-display); color: var(--accent); width: 46px; }
.def { font-size: 1.1rem; border-left: 3px solid var(--cat, var(--accent)); padding: .2rem 0 .2rem .9rem; margin: .6rem 0 .8rem; }
.q { font-family: var(--f-display); font-weight: 500; color: var(--muted); margin: .2rem 0 0; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
.tight { margin: .3rem 0; padding-left: 1.15rem; display: grid; gap: .25rem; }
.note { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: .95rem; margin-top: 14px; }
.rel, .confuse { font-size: .95rem; margin-top: .7rem; }
.confuse { background: var(--bad-soft); border-radius: 8px; padding: 10px 14px; }

.dg { margin: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; }
.dg figcaption { font: 700 .72rem var(--f-display); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.dg.bad figcaption { color: var(--bad); }
.dg.good figcaption { color: var(--ok); }
.dg.bad { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.dg.good { border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.ba { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 14px; margin-top: 14px; align-items: start; }
@media (max-width: 760px) { .ba { grid-template-columns: 1fr; } }
svg.uml { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.u-body { fill: var(--paper); }
.u-head { fill: var(--head); }
.u-out { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.u-div { stroke: var(--ink); stroke-width: 1; }
.u-name { font: 700 12.5px var(--f-mono); fill: var(--ink); }
.u-st { font: 400 10.5px var(--f-mono); fill: var(--muted); }
.u-mem { font: 400 11.5px var(--f-mono); fill: var(--ink); }
.it { font-style: italic; }
.u-edge { stroke: var(--ink); stroke-width: 1.3; fill: none; }
.u-edge.dash { stroke-dasharray: 6 4; }
.mk-hollow { fill: var(--paper); stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; }
.mk-open { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
.mk-fill { fill: var(--ink); stroke: var(--ink); stroke-width: 1.3; }
.u-lbl, .u-mult { font: 11px var(--f-mono); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.u-lbl { fill: var(--accent); }
.u-mult { fill: var(--muted); font-weight: 700; }
.u-frame { fill: none; stroke: var(--muted); stroke-dasharray: 3 4; }
.u-flbl { font: italic 10.5px var(--f-mono); fill: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: .85rem; border: 1px solid var(--cat); color: var(--cat); border-radius: 99px; padding: 2px 10px; }
.parts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: .3rem 0; }
.parts dt { font: 700 .88rem var(--f-mono); color: var(--cat); }
.parts dd { margin: 0; }
@media (max-width: 560px) { .parts { grid-template-columns: 1fr; } .parts dd { margin-bottom: 6px; } }
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin: 1rem 0 .2rem; }
.flow span { font: 700 .72rem var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.flow code { background: none; border: 1px dashed var(--line); padding: 6px 10px; line-height: 1.5; display: block; flex: 1; min-width: 240px; }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
@media (max-width: 600px) { .pc { grid-template-columns: 1fr; } }
.pc > div { border-radius: 8px; padding: 10px 14px; }
.pc ul { margin: 0; padding-left: 1.1rem; font-size: .95rem; }
.pro { background: var(--ok-soft); } .pro h4 { color: var(--ok); }
.con { background: var(--bad-soft); } .con h4 { color: var(--bad); }
.pat { border-top: 4px solid var(--cat); }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.jump button { font: .88rem var(--f-body); border: 1px solid var(--cat); color: var(--cat); background: var(--paper); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
.jump button:hover { background: var(--cat); color: var(--paper); }

.solid-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 18px; }
.solid-strip a { display: flex; flex-direction: column; gap: 2px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; text-decoration: none; color: var(--ink); }
.solid-strip b { font: 800 1.6rem/1 var(--f-display); color: var(--accent); }
.solid-strip span { font-size: .8rem; color: var(--muted); line-height: 1.3; }
@media (max-width: 600px) { .solid-strip { grid-template-columns: repeat(5, minmax(0, 1fr)); } .solid-strip span { display: none; } }

table { border-collapse: collapse; width: 100%; }
.tbl-wrap { overflow-x: auto; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
thead th { font: 700 .75rem var(--f-display); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
tbody th { font-family: var(--f-display); font-weight: 700; }
.rels td.dg-cell { width: 330px; min-width: 220px; }
.rels .how { color: var(--muted); font-size: .9rem; margin-top: 4px; }
.mini { width: auto; margin-top: 10px; }
.mini caption { text-align: left; font: 700 .75rem var(--f-display); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding-bottom: 4px; }
.mini td { padding: 5px 12px 5px 0; border: 0; }
.mini.wide { width: 100%; }
.mini.wide td { border-bottom: 1px solid var(--line); }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: .5rem; }
.checks li { padding-left: 1.6rem; position: relative; }
.checks li::before { content: '✗'; position: absolute; left: 0; color: var(--bad); font-weight: 700; }
.sum th a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--muted); }
.cheat tr.grp td { font: 800 .8rem var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--cat); background: color-mix(in srgb, var(--cat) 10%, transparent); padding: 8px 12px; }
.cheat th { border-left: 3px solid var(--cat); }
.cheat th a { color: var(--ink); text-decoration: none; }
.cheat th a:hover { color: var(--cat); }
.cheat .kw { color: var(--cat); font-size: .88rem; width: 24%; }
.cheat tbody th { width: 18%; }
.sec-h { margin: 30px 0 14px; }
.cmp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.cmp { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.cmp h3 { font-size: 1.02rem; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 0 0 .4rem; }
.cmp h3 span { color: var(--muted); font-weight: 500; font-size: .85rem; }
.cmp p { font-size: .95rem; }
.tip { color: var(--accent); font-size: .9rem !important; border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 10px; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.tabs button { font: 700 .92rem var(--f-display); border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ex-n { font: 700 .72rem var(--f-display); text-transform: uppercase; letter-spacing: .1em; color: var(--accent); margin: 0; }
.ex-q { font-size: 1.05rem; }
.ex-a { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
select { font: inherit; font-size: .95rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); min-width: 220px; }
.btn { font: 700 .92rem var(--f-display); background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 8px; padding: 9px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
:root[data-theme="dark"] .btn { color: #0d1020; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0d1020; } }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ok { background: var(--ok); border-color: var(--ok); }
.btn.bad { background: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.big { padding: 12px 26px; font-size: 1rem; }
.btn kbd { background: transparent; color: inherit; border-color: currentColor; opacity: .7; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; }
.solid-btns .btn { flex-direction: column; gap: 0; min-width: 64px; padding: 8px 12px; }
.solid-btns .btn { font-size: 1.3rem; }
.solid-btns .btn span { font: .7rem var(--f-mono); }
.ex-res { margin-top: 14px; border-radius: 8px; padding: 12px 16px; background: var(--accent-soft); }
.ex-res.ok { background: var(--ok-soft); }
.ex-res.bad { background: var(--bad-soft); }
.verdict { font: 700 1rem var(--f-display); }
.ex-res.ok .verdict { color: var(--ok); }
.ex-res.bad .verdict { color: var(--bad); }
.pill { display: inline-block; font: 700 .7rem var(--f-display); text-transform: uppercase; letter-spacing: .07em; color: var(--cat); border: 1px solid var(--cat); border-radius: 99px; padding: 1px 9px; vertical-align: middle; }
.hint { color: var(--muted); font-style: italic; }
details.sol { margin-top: 12px; }
details.sol summary { cursor: pointer; font: 700 .95rem var(--f-display); color: var(--accent); padding: 6px 0; }
details.sol .dg { margin-top: 12px; }

.fc-bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 12px; }
.fc-bar label { font-size: .9rem; color: var(--muted); }
.tgl { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.fc-count { margin-left: auto; font: .85rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.fc-wrap { margin-top: 18px; display: grid; gap: 14px; }
.fc { position: relative; min-height: 300px; display: grid; place-items: center; text-align: center; background: var(--paper); border: 1px solid var(--line); border-top: 5px solid var(--cat); border-radius: 14px; padding: 44px 28px 40px; cursor: pointer; color: var(--ink); font: inherit; width: 100%; }
.fc.flipped { background: color-mix(in srgb, var(--cat) 7%, var(--paper)); }
.fc-tag { position: absolute; top: 14px; left: 18px; font: 700 .7rem var(--f-display); text-transform: uppercase; letter-spacing: .1em; color: var(--cat); }
.fc-hint { position: absolute; bottom: 12px; left: 0; right: 0; font-size: .8rem; color: var(--muted); }
.fc-face { max-width: 640px; width: 100%; }
.fc-def { font-size: 1.15rem; line-height: 1.5; }
.fc-def svg.uml { max-width: 360px; }
.fc-term { font: 800 1.8rem/1.2 var(--f-display); margin: 0; }
.fc-prompt { color: var(--muted); font-size: .9rem; margin-top: 1rem; }
.fc-extra { color: var(--muted); font-size: .95rem; margin-top: .8rem; }
.fc-actions { display: flex; gap: 12px; justify-content: center; }
.fc.done { cursor: default; }
.big { font-size: 1.2rem; }

.quiz-setup { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.field { display: grid; gap: 4px; }
.field label { font-size: .85rem; color: var(--muted); }
.best { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; }
.best div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; }
.best span { font-size: .82rem; color: var(--muted); }
.best b { font: 800 1.4rem var(--f-display); font-variant-numeric: tabular-nums; }
.best .ok b { color: var(--ok); } .best .mid b { color: var(--mid); } .best .bad b { color: var(--bad); }
.qz { margin-top: 16px; }
.qz-q { font-size: 1.2rem; margin: .8rem 0 1rem; }
.qz-opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; font: inherit; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.dim { opacity: .55; }
.opt:disabled { cursor: default; }
.qz-ex { margin-top: 14px; padding: 12px 16px; border-radius: 8px; }
.qz-ex.ok { background: var(--ok-soft); } .qz-ex.ok b { color: var(--ok); }

<body>
<div class="app">
  <nav class="side" aria-label="Secciones">
    <a class="brand" href="#inicio">Guía ADOO<small>Final · UADE · UML, SOLID, GRASP, GoF</small></a>
    <div id="nav"></div>
  </nav>
  <main id="main"></main>
</div>
<script>// Mini motor de diagramas de clases UML -> SVG
const UML = (() => {
  const CW = 6.9, NW = 7.6, LH = 15;
  let seq = 0;
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const parse = s => {
    let st = false, ab = false;
    while (/^[_*]/.test(s)) { if (s[0] === '_') st = true; else ab = true; s = s.slice(1); }
    return { s, st, ab };
  };
  const mk = kind => (id, name, x, y, o = {}) => ({ kind, id, name, x, y, ...o });

  function measure(b) {
    if (b.kind === 'note') {
      b.w = b.w || Math.round(Math.max(...b.t.map(l => l.length)) * 6.6 + 26);
      b.h = b.t.length * 15 + 14;
      return;
    }
    b.stTxt = [b.kind === 'interface' ? '«interface»' : null, b.kind === 'abstract' ? '{abstract}' : null, b.st ? '«' + b.st + '»' : null].filter(Boolean).join(' ') || null;
    const lines = [...(b.a || []), ...(b.o || [])].map(l => parse(l).s);
    const w = Math.max(b.name.length * NW, b.stTxt ? b.stTxt.length * CW : 0, ...lines.map(l => l.length * CW)) + 22;
    b.w = b.w || Math.max(84, Math.round(w));
    b.hh = b.stTxt ? 36 : 24;
    b.ah = (b.kind === 'interface' && !b.a) ? 0 : (b.a && b.a.length ? b.a.length * LH + 8 : 8);
    b.oh = b.o && b.o.length ? b.o.length * LH + 8 : 8;
    b.h = b.hh + b.ah + b.oh;
  }

  function txt(raw, x, y) {
    const { s, st, ab } = parse(raw);
    return `<text x="${x}" y="${y}" class="u-mem${ab ? ' it' : ''}"${st ? ' text-decoration="underline"' : ''}>${esc(s)}</text>`;
  }

  function drawBox(b) {
    if (b.kind === 'note') {
      const { x, y, w, h } = b;
      return `<g class="u-note"><path d="M${x},${y} H${x + w - 12} L${x + w},${y + 12} V${y + h} H${x} Z" class="u-nbody"/><path d="M${x + w - 12},${y} V${y + 12} H${x + w}" class="u-nfold"/>` +
        b.t.map((l, i) => `<text x="${x + 9}" y="${y + 19 + i * 15}" class="u-ntxt">${esc(l)}</text>`).join('') + '</g>';
    }
    const cx = b.x + b.w / 2;
    let s = `<g class="u-box${b.ext ? ' u-ext' : ''}">`;
    s += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" class="u-body"/>`;
    s += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.hh}" class="u-head"/>`;
    if (b.stTxt) s += `<text x="${cx}" y="${b.y + 14}" class="u-st" text-anchor="middle">${esc(b.stTxt)}</text>`;
    s += `<text x="${cx}" y="${b.y + (b.stTxt ? 29 : 17)}" class="u-name${b.kind === 'abstract' ? ' it' : ''}" text-anchor="middle">${esc(b.name)}</text>`;
    let yy = b.y + b.hh;
    s += `<line x1="${b.x}" y1="${yy}" x2="${b.x + b.w}" y2="${yy}" class="u-div"/>`;
    if (b.ah) {
      (b.a || []).forEach((t, i) => s += txt(t, b.x + 8, yy + 15 + i * LH));
      yy += b.ah;
      s += `<line x1="${b.x}" y1="${yy}" x2="${b.x + b.w}" y2="${yy}" class="u-div"/>`;
    }
    (b.o || []).forEach((t, i) => s += txt(t, b.x + 8, yy + 15 + i * LH));
    s += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" class="u-out"/></g>`;
    return s;
  }

  function clip(b, cx, cy, dx, dy) {
    let t = Infinity;
    if (dx > 0) t = Math.min(t, (b.x + b.w - cx) / dx);
    if (dx < 0) t = Math.min(t, (b.x - cx) / dx);
    if (dy > 0) t = Math.min(t, (b.y + b.h - cy) / dy);
    if (dy < 0) t = Math.min(t, (b.y - cy) / dy);
    return [cx + t * dx, cy + t * dy];
  }

  function markers(type, p, o) {
    const dashed = type === 'real' || type === 'dep' || type === 'anchor';
    let m = '';
    if (type === 'inh' || type === 'real') m += ` marker-end="url(#${p}-tri)"`;
    if (type === 'nav' || type === 'dep' || o.nav) m += ` marker-end="url(#${p}-arr)"`;
    if (type === 'agg') m += ` marker-start="url(#${p}-dia)"`;
    if (type === 'comp') m += ` marker-start="url(#${p}-diaf)"`;
    return `class="u-edge${dashed ? ' dash' : ''}${type === 'anchor' ? ' anchor' : ''}"${m}`;
  }

  function lbl(text, x, y, anchor, cls = 'u-lbl') {
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" class="${cls}">${esc(text)}</text>`;
  }

  function edge(r, B, p, ext) {
    const [f, t, type, o = {}] = r;
    const a = B[f], b = B[t];
    if (f === t) {
      const x0 = a.x + a.w, y1 = a.y + a.h * 0.3, y2 = a.y + a.h * 0.72;
      ext.x = Math.max(ext.x, x0 + 40 + (o.label || '').length * 6.6);
      ext.x = Math.max(ext.x, x0 + 8 + Math.max((o.r1 || '').length + (o.m1 || '').length, (o.r2 || '').length + (o.m2 || '').length) * 6.8);
      let s = `<path d="M${x0},${y1} H${x0 + 30} V${y2} H${x0 + 1}" fill="none" ${markers(type, p, o)}/>`;
      if (o.label) s += lbl(o.label, x0 + 35, (y1 + y2) / 2 + 4, 'start');
      if (o.m1 || o.r1) s += lbl([o.m1, o.r1].filter(Boolean).join(' '), x0 + 6, y1 - 6, 'start', 'u-mult');
      if (o.m2 || o.r2) s += lbl([o.m2, o.r2].filter(Boolean).join(' '), x0 + 6, y2 + 14, 'start', 'u-mult');
      return s;
    }
    let x1 = a.x + a.w / 2, y1 = a.y + a.h / 2, x2 = b.x + b.w / 2, y2 = b.y + b.h / 2;
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const off = o.off || 0, nx = -uy, ny = ux;
    x1 += nx * off; y1 += ny * off; x2 += nx * off; y2 += ny * off;
    const p1 = clip(a, x1, y1, dx, dy), p2 = clip(b, x2, y2, -dx, -dy);
    ext.mids[f + '|' + t] = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
    let s = `<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" ${markers(type, p, o)}/>`;
    const vert = Math.abs(ux) < 0.35;
    const diag = !vert && Math.abs(uy) > 0.3;
    const place = (px, py, text, cls) => {
      if (vert) return lbl(text, px + 7, py + 4, 'start', cls);
      if (diag && cls === 'u-mult') { const k = (-uy) >= 0 ? 1 : -1, qx = -uy * k, qy = ux * k; return lbl(text, px + qx * 12, py + qy * 12 + 4, qx >= 0 ? 'start' : 'end', cls); }
      return lbl(text, px, py - 6, 'middle', cls);
    };
    if (o.label) s += place((p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2, o.label, 'u-lbl');
    if (o.m1) s += place(p1[0] + ux * 18, p1[1] + uy * 18, o.m1, 'u-mult');
    if (o.m2) s += place(p2[0] - ux * 20, p2[1] - uy * 20, o.m2, 'u-mult');
    return s;
  }

  function D(boxes, rels = [], opts = {}) {
    const p = 'u' + (++seq);
    const B = {};
    boxes.forEach(b => { measure(b); B[b.id] = b; });
    const frames = (opts.frames || []).map(fr => {
      const bs = fr.ids.map(id => B[id]);
      const x = Math.min(...bs.map(b => b.x)) - 14, y = Math.min(...bs.map(b => b.y)) - 30;
      const X = Math.max(...bs.map(b => b.x + b.w)) + 14, Y = Math.max(...bs.map(b => b.y + b.h)) + 14;
      return { x, y, w: X - x, h: Y - y, label: fr.label };
    });
    const ext = { x: -Infinity, mids: {} };
    let edges = rels.map(r => edge(r, B, p, ext)).join('');
    (opts.ac || []).forEach(({ cls, a, b }) => {
      const m = ext.mids[a + '|' + b] || ext.mids[b + '|' + a], c = B[cls];
      const cx = c.x + c.w / 2, cy = c.y + c.h / 2, q = clip(c, cx, cy, m[0] - cx, m[1] - cy);
      edges += `<line x1="${m[0].toFixed(1)}" y1="${m[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" class="u-edge dash anchor"/>`;
    });
    const all = [...boxes, ...frames];
    const minX = Math.min(...all.map(b => b.x)) - 22, minY = Math.min(...all.map(b => b.y)) - 22;
    const maxX = Math.max(ext.x, ...all.map(b => b.x + b.w)) + 22, maxY = Math.max(...all.map(b => b.y + b.h)) + 22;
    const W = Math.round(maxX - minX), H = Math.round(maxY - minY);
    const defs = `<defs>
      <marker id="${p}-tri" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L13,7 L1,13 z" class="mk-hollow"/></marker>
      <marker id="${p}-arr" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11" class="mk-open"/></marker>
      <marker id="${p}-dia" viewBox="0 0 18 12" refX="1" refY="6" markerWidth="18" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,6 L9,1 L17,6 L9,11 z" class="mk-hollow"/></marker>
      <marker id="${p}-diaf" viewBox="0 0 18 12" refX="1" refY="6" markerWidth="18" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,6 L9,1 L17,6 L9,11 z" class="mk-fill"/></marker>
    </defs>`;
    const fr = frames.map(f => `<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="6" class="u-frame"/><text x="${f.x + 10}" y="${f.y + 16}" class="u-flbl">${esc(f.label)}</text>`).join('');
    return `<svg class="uml" viewBox="${minX} ${minY} ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(opts.title || 'Diagrama de clases UML')}">${defs}${fr}${boxes.map(drawBox).join('')}${edges}</svg>`;
  }

  return { C: mk('class'), I: mk('interface'), A: mk('abstract'), N: (id, t, x, y) => ({ kind: 'note', id, t, x, y }), D };
})();
const { C, I, A, N, D } = UML;

// ===================== PATRONES GoF =====================
const CATS = {
  cre: { name: 'Creacionales', one: 'Creacional', view: 'creacionales', blurb: 'Abstraen el proceso de instanciación: <b>cómo se crean los objetos</b>, de modo que el sistema no dependa de qué clase concreta se instancia ni de cómo se arma.' },
  est: { name: 'Estructurales', one: 'Estructural', view: 'estructurales', blurb: 'Resuelven <b>cómo se combinan clases y objetos</b> para formar estructuras más grandes sin perder flexibilidad. Casi todos se apoyan en la composición por sobre la herencia.' },
  com: { name: 'De comportamiento', one: 'Comportamiento', view: 'comportamiento', blurb: 'Se ocupan de <b>los algoritmos y del reparto de responsabilidades</b> entre objetos. Describen no sólo estructuras de clases sino formas de comunicación.' }
};

// key: [etiqueta, texto] → recuadros "La clave", "Ojo", "Trampa"
const PATTERNS = [
// ---------- CREACIONALES ----------
{ id: 'singleton', name: 'Singleton', en: 'Singleton (Instancia única)', cat: 'cre', scope: 'de objeto',
  intent: 'Garantiza que una clase tenga una única instancia y provee un punto de acceso global a ella.',
  when: 'Cuando tiene que existir exactamente un objeto de una clase y varios componentes lo usan: gestor de configuración, logger, pool de conexiones, cola de trabajos compartida, caché.',
  clues: ['un único punto de acceso', 'una sola instancia en toda la aplicación', 'configuración global del sistema', 'cola única compartida'],
  parts: [['Singleton', 'Atributo <b>estático privado</b> con la instancia, <b>constructor privado</b> y método <b>estático</b> <code>getInstancia()</code> que la crea la primera vez y después devuelve siempre la misma.'], ['Cliente', 'Nunca hace <code>new</code>: pide la instancia con <code>getInstancia()</code>.']],
  how: 'Cliente → Singleton.getInstancia() → si instancia == null la crea → devuelve siempre la misma',
  example: '<code>ColaDeSubidas</code> en el caso Tuich: tiene que haber una sola cola de subidas en toda la aplicación, con un punto de acceso global.',
  key: [['Los 3 elementos', 'Si dibujás un Singleton tienen que estar los tres: atributo estático privado, constructor privado y método estático de acceso. Sin el constructor privado no es un Singleton.'], ['Trampa', 'No lo pongas en todas partes. Un Singleton que no podés anclar a una frase del enunciado resta puntos.']],
  pros: ['Garantiza una sola instancia', 'Inicialización diferida (lazy)', 'Acceso controlado desde cualquier parte'],
  cons: ['Introduce estado global y acopla la aplicación a una clase concreta (viola DIP)', 'Viola SRP en sentido estricto: también controla su propia instanciación', 'Dificulta las pruebas unitarias: no se puede sustituir por un doble', 'Con concurrencia hay que cuidar la inicialización (temprana o doble chequeo con bloqueo)', 'Hoy suele preferirse inyección de dependencias con alcance de instancia única'],
  rel: 'Las fábricas de Abstract Factory, los Builders y las Facades suelen implementarse como Singleton.',
  confuse: '<b>Clase estática</b>: no tiene instancia, no puede implementar interfaces ni pasarse como parámetro; el Singleton es un objeto de verdad. <b>Flyweight</b>: muchas instancias compartidas, no una sola.',

// ===================== COMPARACIONES =====================
const COMPARE = [
{ a: 'Strategy', b: 'State', diff: 'Misma estructura. <b>Quién elige:</b> en Strategy el cliente, desde afuera; en State el propio objeto, por eventos internos. <b>¿Se conocen?</b> Las estrategias no; un estado sabe a cuál transicionar. <b>Frecuencia:</b> la estrategia se configura y suele quedar fija; el estado cambia repetidamente durante la vida del objeto. <b>Intención:</b> distintas formas de hacer lo mismo vs distintos comportamientos según la situación.', tip: 'Si dudás, elegí uno y argumentá el criterio: eso se acepta.' },
{ a: 'Strategy', b: 'Template Method', diff: 'Ambos varían un algoritmo. <b>Strategy</b>: composición, en ejecución. <b>Template Method</b>: herencia, en compilación; reutiliza más código y controla mejor el orden.', tip: '"El proceso es siempre igual pero el paso N varía" → Template Method.' },
{ a: 'Factory Method', b: 'Abstract Factory', diff: '<b>FM</b> crea un producto, se basa en herencia (las subclases deciden), un método creador. <b>AF</b> crea una familia, se basa en composición (el cliente recibe la fábrica), una interfaz con varios métodos creadores.', tip: 'Cada método de una AF suele ser un FM.' },
{ a: 'Adapter', b: 'Facade', diff: '<b>Adapter</b> traduce una interfaz existente a otra que el cliente ya esperaba; suele envolver una sola clase; motivo: incompatibilidad. <b>Facade</b> simplifica un conjunto de interfaces sin interfaz objetivo previa; envuelve un subsistema entero; motivo: complejidad. Ninguno agrega funcionalidad.', tip: '' },
{ a: 'Adapter', b: 'Bridge', diff: '<b>Adapter</b> se aplica después, sobre algo que ya existe. <b>Bridge</b> se diseña antes, para que dos jerarquías evolucionen separadas.', tip: '' },
{ a: 'Adapter', b: 'Decorator', diff: 'El <b>Adapter</b> sólo traduce, no agrega lógica. Si además suma comportamiento, es un <b>Decorator</b> (que mantiene la misma interfaz).', tip: '' },
{ a: 'Decorator', b: 'Proxy', diff: 'Mismo esqueleto. <b>Decorator</b> agrega funcionalidad y suele recibir al envuelto desde afuera. <b>Proxy</b> controla el acceso sin cambiar la funcionalidad y con frecuencia crea y administra al real.', tip: '' },
{ a: 'Decorator', b: 'Composite', diff: 'Ambos componen la misma interfaz que implementan. <b>Composite</b> agrupa N hijos para tratarlos uniformemente; <b>Decorator</b> envuelve a uno solo para agregarle comportamiento.', tip: '' },
{ a: 'Observer', b: 'Mediator', diff: '<b>Observer</b> difunde un evento a muchos. <b>Mediator</b> centraliza la comunicación bidireccional entre pares.', tip: '' },
{ a: 'Command', b: 'Strategy', diff: 'Los dos encapsulan "algo que se hace". <b>Command</b> encapsula una petición completa con su receptor y suele guardarse o encolarse; <b>Strategy</b> encapsula un algoritmo que el contexto usa para resolver algo.', tip: '' },
{ a: 'Builder', b: 'Abstract Factory', diff: 'La fábrica devuelve el producto de una sola vez; el <b>Builder</b> lo arma en varios pasos y lo entrega al final.', tip: '' },
{ a: 'Agregación', b: 'Composición', diff: 'Ciclo de vida independiente vs controlado por el todo. Si se elimina el todo, la parte sigue existiendo vs se elimina también. La parte puede compartirse vs pertenece a un único todo. Equipo ◇── Jugador vs Factura ◆── ItemFactura.', tip: 'Si la parte puede pertenecer a dos todos al mismo tiempo, nunca es composición.' },
{ a: 'Clase abstracta', b: 'Interfaz', diff: 'La clase abstracta tiene comportamiento compartido y estado; la interfaz es un contrato puro. Herencia simple vs una clase implementa varias interfaces.', tip: 'Comportamiento común → abstracta (probable Template Method). Contrato sin jerarquía común → interfaz.' },
{ a: 'GRASP', b: 'GoF', diff: '<b>GRASP</b> dice quién debería hacer cada cosa (criterios de asignación de responsabilidades). <b>GoF</b> dice qué estructura de clases armar. Muchos patrones GoF son la materialización de un principio GRASP.', tip: '' },
{ a: 'Patrón de diseño', b: 'Patrón arquitectónico', diff: 'El de diseño resuelve problemas a nivel de clases y objetos (Strategy, Observer). El arquitectónico organiza el sistema completo en capas o componentes (MVC, capas, cliente-servidor, microservicios). MVC es arquitectónico, no GoF, aunque use Observer y Strategy por dentro.', tip: '' },
{ a: 'Librería', b: 'Framework', diff: 'El patrón es una idea que vos implementás. A la <b>librería</b> la llamás vos. El <b>framework</b> te llama a vos: define el flujo y vos completás los huecos (inversión de control).', tip: '' }
];

// ===================== PREGUNTAS TEÓRICAS (sección 12 + extras) =====================
const TEORICAS = [
['Diferencia entre agregación y composición.', 'Ambas son parte-todo. En la agregación la parte tiene vida independiente y puede pertenecer a más de un todo; en la composición el todo controla el ciclo de vida de la parte, que se elimina con él y pertenece a un único todo. Equipo ◇── Jugador frente a Factura ◆── ItemFactura.'],
['Diferencia entre clase abstracta e interfaz, y cuándo usar cada una.', 'La clase abstracta puede tener métodos concretos y estado, se hereda de una sola y sus métodos pueden ser protegidos. La interfaz es un contrato de métodos públicos sin estado (salvo constantes) y una clase puede implementar varias. Abstracta cuando hay comportamiento común para compartir; interfaz cuando sólo se define un contrato entre clases sin jerarquía común. (Desde Java 8 las interfaces admiten métodos default y static, pero en diseño se las sigue tratando como contrato).'],
['¿Qué es el polimorfismo y por qué permite cumplir OCP?', 'Es la capacidad de que una misma llamada se resuelva de distinta forma según el tipo real del objeto. Permite cumplir OCP porque el cliente trabaja contra la abstracción: un comportamiento nuevo es una implementación nueva, sin modificar al cliente.'],
['Enunciá SOLID y dá un ejemplo de violación.', 'SRP (una razón de cambio), OCP (abierto a extensión, cerrado a modificación), LSP (los subtipos son sustituibles), ISP (interfaces chicas), DIP (depender de abstracciones). Violación de OCP: una calculadora de descuentos con una cadena de if por tipo de cliente que hay que editar cada vez que aparece uno nuevo.'],
['Diferencia entre Strategy y State.', 'Estructuralmente casi idénticos. En Strategy el cliente externo elige el algoritmo y las alternativas no se conocen; en State el cambio lo dispara el propio objeto, un estado puede provocar la transición al siguiente y el objeto atraviesa muchos estados durante su vida. La diferencia es de intención.'],
['Diferencia entre Adapter y Facade.', 'Adapter traduce una interfaz existente a otra que el cliente ya esperaba (incompatibilidad). Facade ofrece una interfaz nueva y simplificada sobre un subsistema (complejidad). Ninguno agrega funcionalidad.'],
['Diferencia entre Factory Method y Abstract Factory.', 'Factory Method crea un producto y se apoya en la herencia: las subclases deciden. Abstract Factory crea familias de productos relacionados y se apoya en la composición: el cliente recibe una fábrica concreta. Cada método de una Abstract Factory suele ser un Factory Method.'],
['Diferencia entre Decorator y herencia, y entre Decorator y Proxy.', 'Frente a la herencia, Decorator combina responsabilidades en ejecución y evita la explosión de subclases (3 extras: 3 clases en vez de 8). Frente a Proxy, cambia la intención: Decorator agrega funcionalidad, Proxy controla el acceso al objeto real.'],
['¿Qué es Fabricación Pura y por qué el DAO lo es?', 'Una clase inventada que no representa un concepto del dominio, creada para mantener alta cohesión y bajo acoplamiento. El DAO lo es porque en el negocio no existe un "objeto de acceso a datos": se crea para que las clases de dominio no carguen con la responsabilidad técnica de persistirse.'],
['¿Qué son alta cohesión y bajo acoplamiento, y por qué están en tensión?', 'La cohesión mide qué tan relacionadas están las responsabilidades de una clase; el acoplamiento, cuántas dependencias hay entre clases. Llevadas al extremo compiten: minimizar el acoplamiento llevaría a concentrar todo en una clase (cohesión pésima) y maximizar la cohesión a muchas clases diminutas muy acopladas. El buen diseño busca el equilibrio.'],
['¿Qué es un modelo de dominio anémico y qué principio viola?', 'Un modelo donde las clases sólo tienen atributos con getters y setters, y toda la lógica vive en servicios o gestores. Viola Experto en Información y produce baja cohesión: separa los datos del comportamiento que los usa.'],
['Diferencia entre modelo de dominio y diagrama de clases de diseño.', 'El modelo de dominio es de análisis: conceptos del negocio, atributos y asociaciones, sin métodos ni patrones. El diagrama de diseño es de solución: agrega visibilidad, tipos, métodos, navegabilidad, interfaces y patrones.'],
['¿Qué desventajas tiene el Singleton?', 'Introduce estado global, acopla la aplicación a una clase concreta (viola DIP), dificulta las pruebas porque no se puede sustituir, exige control de concurrencia y en sentido estricto viola SRP al ocuparse de su propia instanciación.'],
['¿Qué son las Variaciones Protegidas y cómo se relacionan con OCP?', 'Identificar los puntos previsibles de variación o inestabilidad y encapsularlos detrás de una interfaz estable. OCP es el mismo criterio en términos de modificación de código: si la variación está protegida, extender no obliga a modificar.'],
['¿Qué diagramas UML conocés?', 'Estructurales: clases, objetos, componentes, despliegue, paquetes y estructura compuesta. De comportamiento: casos de uso, secuencia, comunicación, actividad, estados y tiempos.'],
['¿Qué es un patrón de diseño y qué elementos lo componen?', 'Una solución probada a un problema recurrente en un contexto dado. Elementos: nombre, problema (contexto de aplicación), solución (participantes y relaciones) y consecuencias (ventajas y costos).'],
['¿Cuál es la diferencia entre GRASP y GoF?', 'GRASP son principios de asignación de responsabilidades: dicen quién debe hacer cada cosa. GoF es un catálogo de 23 soluciones: dicen qué forma darle al diseño. Muchos patrones GoF materializan un principio GRASP.'],
['¿Cuándo conviene no aplicar un patrón?', 'Cuando no hay una variación real que proteger. Aplicar un patrón a un problema estable suma clases e indirección sin beneficio: es sobre-diseño, y se descuenta igual que la falta de un patrón necesario.'],

['¿Qué es el patrón Null Object?', 'Una implementación de la interfaz que no hace nada (o hace lo neutro) y se usa en lugar de null. Elimina los if (x != null) y aprovecha el polimorfismo. Ej.: SinMembresia en Tuich.'],
['Diferencia entre DAO y Repository.', 'El DAO encapsula el acceso a la fuente de datos con operaciones CRUD orientadas a objetos. El Repository está más cerca del dominio: se comporta como una colección en memoria de objetos del dominio y esconde por completo la base. Ambos son Fabricación Pura e Indirección.'],

  <section class="card">
    <div class="card-h"><h2 class="grow">Cómo se justifica un patrón</h2>${gotBox('ex-just')}</div>
    <p class="tpl"><b>Patrón X (categoría).</b> El enunciado indica que <i>"[cita textual del enunciado]"</i>. Eso implica que <i>[qué varía o qué problema hay]</i>. Apliqué X porque <i>[qué encapsula o qué desacopla]</i>, lo que deja a ClaseA cerrada a modificación y permite agregar nuevas ClaseB sin tocar el código existente (OCP y Variaciones Protegidas). Las clases participantes son <i>Contexto, IAbstraccion, ImplA e ImplB</i>.</p>
    <p><b>Citar el enunciado es lo que separa un 7 de un 10:</b> demuestra que el patrón salió del problema y no de una lista memorizada. Sumá siempre el principio SOLID o GRASP que respalda la decisión: es gratis y muestra que entendés el porqué.</p>
    <h3>Armador de justificaciones</h3>
    <p class="muted">Practicá con cualquier enunciado: completá los campos y copiá el párrafo. Viene cargado con un ejemplo de Tuich.</p>
    <div class="jb">
      <div class="field"><label for="jb-p">Patrón</label><select id="jb-p" data-jb>${opts}</select></div>
      <div class="field wide"><label for="jb-c">Cita textual del enunciado</label><input id="jb-c" data-jb value="cada uno de los clientes puede elegir el modo de notificación que más le guste (Push o email), pero solo podrá elegir un tipo"></div>
      <div class="field wide"><label for="jb-v">Qué varía o qué problema hay</label><input id="jb-v" data-jb value="el canal de envío es una elección del usuario entre alternativas equivalentes, y pueden sumarse canales nuevos"></div>
      <div class="field wide"><label for="jb-k">Clases participantes</label><input id="jb-k" data-jb value="Usuario (contexto), INotificacion, NotificacionPush y NotificacionEmail"></div>
    </div>
    <div class="jb-out" id="jb-out"></div>
    <div class="row-btns"><button type="button" class="btn ghost" data-act="jb-copy">Copiar párrafo</button><span class="muted" id="jb-msg" aria-live="polite"></span></div>
  </section>

  <section class="card">
    <h2>El error estratégico más común</h2>
    <p><b>Meter patrones de más.</b> Un enunciado suele tener entre cuatro y seis patrones reales; el resto es modelado de dominio puro. Si aplicás un Singleton, un Factory y un Facade "por las dudas" y no podés anclarlos a una frase del enunciado, el profesor lo lee como que no entendiste el criterio de aplicación. Cada patrón tiene que poder defenderse con una cita.</p>
    <h3>Los diez errores que más bajan la nota</h3>
    <ol class="steps errs">
      <li><b>Multiplicidades faltantes o mal puestas.</b> Es lo primero que mira un corrector.</li>
      <li><b>Todo con asociación simple.</b> Si algo es parte-todo, usá agregación o composición y sabé defender cuál.</li>
      <li><b>Atributos públicos.</b> Siempre <code>-</code>, con acceso por métodos.</li>
      <li><b>Modelo de dominio anémico.</b> Clases con puros atributos y un GestorGeneral que hace todo. Viola Experto y cohesión.</li>
      <li><b>Sobre-patronear.</b> Cada patrón necesita una frase del enunciado que lo respalde.</li>
      <li><b>No justificar.</b> Sin justificación el patrón casi no suma.</li>
      <li><b>Confundir Strategy con State sin explicar el criterio.</b> Si dudás, elegí uno y argumentá: se acepta.</li>
      <li><b>Mezclar capas.</b> Clases de interfaz gráfica o de base de datos en un diagrama de dominio sin que las pidan.</li>
      <li><b>Nombres inconsistentes.</b> Mezclar inglés y español, plurales o verbos como nombre de clase.</li>
      <li><b>Herencia donde va composición.</b> ¿Es "es un" o "tiene un"? Acordate de LSP.</li>
    </ol>
  </section>

  <section class="card">
    <div class="card-h"><h2 class="grow">Checklist de los últimos diez minutos</h2><button type="button" class="btn ghost sm" data-act="ck-reset">Desmarcar todo</button></div>
    <ul class="cklist">${checklist.map((c, i) => `<li><label><input type="checkbox" data-ck="${i}" ${CHECK[i] ? 'checked' : ''}> <span>${c}</span></label></li>`).join('')}</ul>
  </section>`;
}

function jbRender() {

}

      <div>
        ${table(['Símbolo', 'Visibilidad', 'Alcance'], [['<code>+</code>', 'Pública', 'Desde cualquier lugar'], ['<code>-</code>', 'Privada', 'Sólo la misma clase'], ['<code>#</code>', 'Protegida', 'La clase y sus subclases'], ['<code>~</code>', 'Paquete', 'Clases del mismo paquete']], 'mini')}
      </div>
    </div>
    <h3>Convenciones que te van a mirar en la corrección</h3>
    <ul class="tight">
      <li><b>Atributos siempre privados</b> (<code>-</code>), con acceso mediante métodos. Un atributo público es una falla de encapsulamiento y se descuenta.</li>

      <li><b>Abstractos:</b> nombre de la clase en itálica o «abstract»; los métodos abstractos también en itálica.</li>
      <li><b>Interfaz:</b> estereotipo «interface» arriba del nombre, o la notación de círculo (lollipop).</li>
      <li><b>Los tipos de retorno y de parámetro nunca se omiten.</b> Un método sin tipo de retorno es un error de notación (poné <code>: void</code>).</li>

  </section>

  <section class="card">
    <div class="card-h"><h2 class="grow">Las siete relaciones</h2>${gotBox('uml-rel')}</div>
    <p>Esta es la lámina que más conviene memorizar.</p>
    <div class="tbl-wrap"><table class="rels stack">
      <thead><tr><th>Relación</th><th>Cómo se dibuja</th><th>Qué significa</th></tr></thead><tbody>
      ${rowRel('Asociación', 'Relación estructural: una clase mantiene una referencia a otra como atributo. La relación por defecto cuando dos objetos se conocen pero ninguno es parte del otro.', D([C('a', 'Chofer', 0, 0), C('b', 'Viaje', 230, 0)], [['a', 'b', 'assoc', { m1: '1', m2: '0..*', label: 'realiza' }]]), 'Línea continua. Sin flecha se interpreta como bidireccional.')}
      ${rowRel('Asociación dirigida', 'Navegabilidad: en qué sentido se puede recorrer.', D([C('a', 'Empresa', 0, 0), C('b', 'Empleado', 230, 0)], [['a', 'b', 'nav', { m1: '1', m2: '1..*' }]]), 'La empresa tiene la lista de empleados; el empleado no conoce a su empresa. No hagas todo bidireccional por comodidad: cada sentido extra es una dependencia más.')}
      ${rowRel('Agregación', 'B es parte de A pero vive sin A.', D([C('a', 'Equipo', 0, 0), C('b', 'Jugador', 230, 0)], [['a', 'b', 'agg', { m1: '0..*', m2: '1..*' }]]), 'Rombo <b>vacío</b> del lado del todo.')}
      ${rowRel('Composición', 'B es parte de A y muere con A.', D([C('a', 'Factura', 0, 0), C('b', 'ItemFactura', 230, 0)], [['a', 'b', 'comp', { m1: '1', m2: '1..*' }]]), 'Rombo <b>lleno</b> del lado del todo.')}
      ${rowRel('Generalización', 'Herencia: A es un B.', D([C('a', 'Auto', 0, 0), C('b', 'Vehiculo', 230, 0)], [['a', 'b', 'inh']]), 'Línea continua con triángulo blanco hacia la superclase.')}
      ${rowRel('Realización', 'A implementa la interfaz B.', D([C('a', 'Camion', 0, 2), I('b', 'Pagable', 230, 0)], [['a', 'b', 'real']]), 'Línea <b>punteada</b> con triángulo blanco. En StarUML es otra herramienta: no la confundas con generalización.')}
      ${rowRel('Dependencia', 'A usa a B puntualmente: lo recibe por parámetro, lo instancia en una variable local o usa un método estático.', D([C('a', 'Ecuacion', 0, 0), C('b', 'Math', 230, 0)], [['a', 'b', 'dep', { label: '«usa»' }]]), 'Línea punteada con punta abierta. No lo guarda como atributo: ésa es la diferencia con la asociación.')}
      </tbody></table></div>
    <h3>Agregación vs composición</h3>
    ${table(['', 'Agregación (rombo vacío)', 'Composición (rombo lleno)'], [['Ciclo de vida', 'Independiente', 'El todo controla la vida de la parte'], ['Si se elimina el todo', 'La parte sigue existiendo', 'La parte se elimina también'], ['¿La parte se comparte?', 'Sí, puede pertenecer a varios todos', 'No, pertenece a un único todo'], ['Ejemplo', 'Equipo ◇── Jugador', 'Factura ◆── ItemFactura']])}

  <section class="card">
    <div class="card-h"><h2 class="grow">Multiplicidad, nombres y roles</h2>${gotBox('uml-mult')}</div>
    <div class="split">
      ${table(['Notación', 'Significado'], [['<code>1</code>', 'Exactamente uno (obligatorio)'], ['<code>0..1</code>', 'Cero o uno (opcional)'], ['<code>*</code> o <code>0..*</code>', 'Cero o muchos'], ['<code>1..*</code>', 'Al menos uno'], ['<code>2..5</code>', 'Rango cerrado']], 'mini')}
      <div>
        <p><b>Se lee cruzado:</b> en <code>Empresa 1 ── 1..* Empleado</code>, el <code>1..*</code> del lado de Empleado dice que una empresa tiene uno o más empleados, y el <code>1</code> del lado de Empresa dice que cada empleado pertenece a una sola.</p>
        <p><b>Error frecuentísimo:</b> dejar multiplicidades vacías. StarUML no las completa solo. La diferencia entre <code>0..*</code> y <code>1..*</code> no es cosmética: es una regla de negocio que estás afirmando.</p>
        <p>Poné un <b>verbo sobre la línea</b> (contrata, agrupa, publica) para que la relación se lea como oración: "una Empresa contrata a n Empleados".</p>
      </div>
    </div>
    <figure class="dg">${D([C('e', 'Empresa', 0, 0, { a: ['-nombre: String'], o: ['+contratar(e: Empleado): void'] }), C('m', 'Empleado', 400, 0, { a: ['-legajo: int', '-nombre: String'] })], [['e', 'm', 'assoc', { m1: '1', m2: '1..*', label: 'contrata' }]])}</figure>
  </section>

  <section class="card">
    <div class="card-h"><h2 class="grow">Reflexiva, asociativa, abstracta e interfaz</h2>${gotBox('uml-extra')}</div>
    <p><b>Asociación reflexiva:</b> una clase relacionada consigo misma (jerarquías de empleados, categorías con subcategorías, comentarios con respuestas). Se dibuja con una línea que sale y vuelve a la caja, con multiplicidad y <b>roles</b> en cada punta.</p>
    <p><b>Clase asociativa:</b> cuando la relación tiene datos propios que no son de ninguno de los extremos. Casi siempre que veas un muchos a muchos con atributos propios, va clase asociativa, unida con línea punteada al centro de la asociación. En diseño también se acepta resolverla como una clase intermedia normal con dos asociaciones.</p>
    <figure class="dg">${DRAWS[4].dg()}</figure>
    <h3>Clase abstracta vs interfaz</h3>
    ${table(['', 'Clase abstracta', 'Interfaz'], [
      ['Herencia', 'Puede extender cualquier clase', 'Sólo extiende otras interfaces'],
      ['Métodos', 'Abstractos y concretos', 'Contrato: métodos abstractos (Java 8+ admite default y static, pero en diseño se trata como contrato)'],
      ['Visibilidad', 'Públicos o protegidos', 'Sólo públicos'],
      ['Atributos', 'Cualquiera, con cualquier modificador', 'Sólo constantes public static final'],
      ['Cantidad', 'Herencia simple: una sola', 'Una clase implementa varias']
    ])}
    ${callout('Criterio para elegir', 'Si hay <b>comportamiento común</b> para compartir entre subclases, clase abstracta (y probablemente estés ante un Template Method). Si es <b>sólo un contrato</b> entre clases sin jerarquía ni implementación común, interfaz. En los patrones (Strategy, State, Observer, Adapter, Composite) la abstracción casi siempre es una interfaz.')}
    <figure class="dg">${absInt}<figcaption class="cap">Vehiculo es abstracta (itálica) y reversa() es abstracto. Camion además cumple el contrato Pagable: línea punteada.</figcaption></figure>
    <h3>Estereotipos útiles</h3>
    <p>«interface», «abstract», «static», «enumeration» y, muy recomendable, <b>el nombre del patrón o del rol</b>: «Strategy», «Adapter», «Observer». El corrector ve tu intención de un vistazo, antes de leer la justificación.</p>
  </section>

  <section class="card">
    <h2>Cómo extraer las clases del enunciado</h2>
    <ol class="steps">
      <li><b>Sustantivos → candidatos a clase.</b> Usuario, Video, Comentario, Factura, Membresía, Paquete.</li>
      <li><b>Descartá los que no son clases:</b> los que son atributos (título, nickname, fecha, monto), los sinónimos (usuario y cliente suelen ser la misma clase) y los que están fuera del alcance.</li>
      <li><b>Verbos → métodos o asociaciones.</b> "Un pasajero solicita un viaje" puede ser <code>solicitarViaje()</code> o la asociación Pasajero–Viaje. Experto en Información decide dónde va.</li>
      <li><b>Adjetivos de tipo → jerarquía o patrón.</b> "Membresía básica y premium" puede ser herencia, State o Strategy: depende de si cambia en el tiempo y de quién la cambia.</li>
      <li><b>Frases de variación → patrón.</b> Ver <a href="#senales">Señales del enunciado</a>.</li>
    </ol>
    <h3>Modelo de dominio vs diagrama de clases de diseño</h3>
    ${table(['', 'Modelo de dominio', 'Diagrama de diseño'], [['Etapa', 'Análisis: el problema', 'Diseño: la solución'], ['Contenido', 'Conceptos, atributos y asociaciones', 'Visibilidad, tipos, métodos, navegabilidad, interfaces'], ['Métodos', 'No', 'Sí'], ['Patrones', 'No', 'Sí, y se justifican'], ['Tipos', 'Conceptuales o ausentes', 'Técnicos (String, int, List&lt;T&gt;)']])}
    <p class="muted">En el final te piden el de diseño, porque te piden justificar patrones. Pero la diferencia es pregunta teórica frecuente.</p>
  </section>

  <section class="card">
    <div class="card-h"><h2 class="grow">Los otros diagramas UML</h2>${gotBox('uml-otros')}</div>
    ${table(['Estructurales', 'De comportamiento'], [['Clases, objetos, componentes, despliegue, paquetes, estructura compuesta', 'Casos de uso, secuencia, comunicación, actividad, estados, tiempos']])}

    <p>Complemento natural del patrón State: cada estado es una clase que implementa la interfaz de estado.</p>
    <figure class="dg">${SVG_ESTADOS}</figure>
    <h3>Diagrama de secuencia</h3>
    <p>Interacción entre objetos ordenada en el tiempo. Los objetos se nombran <code>:Clase</code> o <code>nombre:Clase</code>, y cada mensaje tiene que existir como método en el diagrama de clases.</p>
    <figure class="dg">${SVG_SECUENCIA}</figure>
  </section>`;
}

function vPatrones() {
  return `

  <section class="card">
    <h2>Elementos de un patrón</h2>

      <div><b>Problema</b><span>cuándo aplicarlo, en qué contexto y bajo qué condiciones</span></div>
      <div><b>Solución</b><span>participantes, relaciones y responsabilidades</span></div>

  </section>
  <section class="card">

function detectHTML(text) {
  const hits = [];
  DETECT.forEach(([id, re]) => { re.lastIndex = 0; let m; while ((m = re.exec(text))) { if (m[0].length) hits.push([m.index, m.index + m[0].length, id]); } });
  hits.sort((a, b) => a[0] - b[0] || (b[1] - b[0]) - (a[1] - a[0]));
  const kept = []; let end = -1;
  hits.forEach(h => { if (h[0] >= end) { kept.push(h); end = h[1]; } });
  let out = '', pos = 0; const count = {};
  kept.forEach(([s, e, id]) => {
    const inf = pinfo(id); count[id] = (count[id] || 0) + 1;
    out += esc(text.slice(pos, s)) + `<mark class="hl" style="--cat:${catVar(inf.cat)}" title="${inf.name}">${esc(text.slice(s, e))}<sup>${inf.name}</sup></mark>`;
    pos = e;
  });
  out += esc(text.slice(pos));
  const sum = Object.entries(count).sort((a, b) => b[1] - a[1]).map(([id, n]) => { const inf = pinfo(id); return `<a class="pill big" href="#${inf.view}" data-goto="${inf.anchor}" style="--cat:${catVar(inf.cat)}">${inf.name} · ${n}</a>`; }).join(' ');
  return { out, sum: sum || '<span class="muted">No encontré frases-gatillo. Puede ser dominio puro, o una forma de decirlo que el detector no conoce.</span>' };
}

function buildCards(deck) {
  let cards = [];
  const want = d => deck === 'all' || deck === d;
  if (want('uml')) cards.push(...UML_CARDS.map(([t, d, x]) => ({ topic: 'uml', term: t, def: d, extra: x, prompt: '¿Qué relación es?' })));
  if (want('solid')) cards.push(...SOLID.map(s => ({ topic: 'solid', term: `${s.letter} · ${s.es}`, def: s.def, extra: 'Pregunta clave: ' + s.q, prompt: '¿Qué principio es?' })));
  if (want('grasp')) cards.push(...GRASP.map(g => ({ topic: 'grasp', term: g.name, def: g.q, extra: g.sol, prompt: '¿Qué GRASP responde esto?' })));
  ['cre', 'est', 'com'].forEach(c => { if (want(c)) cards.push(...PATTERNS.filter(p => p.cat === c).map(p => ({ topic: c, term: p.name, def: p.intent, extra: 'Señales: ' + p.clues.slice(0, 3).join(' · '), prompt: '¿Qué patrón es?' }))); });
  if (want('senal')) cards.push(...SIGNALS.map(([f, id, w]) => ({ topic: 'senal', term: pinfo(id).name, def: f, extra: w, prompt: '¿Qué patrón dispara esta frase?' })));
  if (want('teo')) cards.push(...TEORICAS.map(([q, a]) => ({ topic: 'teo', term: q, def: a, extra: '', prompt: '¿Cuál es la pregunta?', qfirst: true })));
  return shuffle(cards);
}

    const rev = c.qfirst ? !FC.rev : FC.rev;
    const front = rev ? `<p class="fc-term">${c.term}</p><p class="fc-prompt">${c.qfirst ? 'Respondela en voz alta' : '¿Qué es / qué dice?'}</p>` : `<div class="fc-def">${c.def}</div><p class="fc-prompt">${c.prompt}</p>`;
    const back = rev ? `<div class="fc-def">${c.def}</div>${c.extra ? `<p class="fc-extra">${c.extra}</p>` : ''}` : `<p class="fc-term">${c.term}</p>${c.extra ? `<p class="fc-extra">${c.extra}</p>` : ''}`;
    card = `<div role="button" tabindex="0" class="fc${FC.flipped ? ' flipped' : ''}${c.qfirst ? ' long' : ''}" data-act="fc-flip" style="--cat:${catVar(c.topic)}" aria-label="Dar vuelta la tarjeta">
      <span class="fc-tag">${TOPIC_NAMES[c.topic]}</span><div class="fc-face">${FC.flipped ? back : front}</div>
      <span class="fc-hint">${FC.flipped ? '' : 'Tocá o apretá espacio para dar vuelta'}</span></div>
      <div class="fc-actions"><button type="button" class="btn bad" data-act="fc-no" ${FC.flipped ? '' : 'disabled'}>No la sabía <kbd>←</kbd></button><button type="button" class="btn ok" data-act="fc-yes" ${FC.flipped ? '' : 'disabled'}>La sabía <kbd>→</kbd></button></div>`;
  }
  return `
  ${head('Práctica', 'Flashcards', 'Las que no sabés vuelven al final del mazo hasta que salgan todas. El mazo de señales es el que más rinde para el examen.')}
  <div class="fc-bar">
    <label for="fc-deck">Mazo</label><select id="fc-deck">${decks.map(([k, l]) => `<option value="${k}"${FC.deck === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
    <label class="tgl"><input type="checkbox" id="fc-rev" ${FC.rev ? 'checked' : ''}> Invertir</label>
    <button type="button" class="btn ghost sm" data-act="fc-restart">Mezclar y reiniciar</button>
    <span class="fc-count">${FC.known} sabidas · ${FC.queue.length} en el mazo</span>
  </div>
  <div class="bar"><i style="width:${FC.total ? FC.known / FC.total * 100 : 0}%"></i></div>
  <div class="fc-wrap">${card}</div>`;
}

// ===================== quiz =====================
let QZ = null;
function quizStart(topic, n, from) {
  let pool = from || QUIZ.filter(q => topic === 'all' || q[0] === topic);
  pool = shuffle(pool).slice(0, n === 'all' ? pool.length : +n);
  QZ = { topic, items: pool.map(q => ({ q, order: shuffle(q[2].map((_, i) => i)) })), i: 0, answers: [] };
}
const QUIZ_TOPICS = ['examen', 'uml', 'solid', 'grasp', 'cre', 'est', 'com'];

function vQuiz() {
  if (!QZ) {
    const topics = [['all', 'Todo mezclado (simulacro)'], ...QUIZ_TOPICS.map(k => [k, TOPIC_NAMES[k]])];
    return `
    ${head('Práctica', 'Quiz y simulacro', `${QUIZ.length} preguntas de opción múltiple con explicación. Al terminar ves en qué tema fallaste y podés repetir sólo los errores. Atajos: <kbd>1</kbd>–<kbd>4</kbd> para responder y <kbd>Enter</kbd> para seguir.`)}
    <section class="card quiz-setup">
      <div class="field"><label for="qz-topic">Tema</label><select id="qz-topic">${topics.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
      <div class="field"><label for="qz-n">Cantidad</label><select id="qz-n"><option value="10">10 preguntas</option><option value="25" selected>25 preguntas</option><option value="all">Todas las del tema</option></select></div>
      <button type="button" class="btn big" data-act="qz-start">Empezar</button>
    </section>
    <section class="card"><h2>Tus mejores resultados</h2>
      <div class="best">${topics.map(([k, l]) => `<div><span>${k === 'all' ? 'Simulacro' : l}</span><b>${BEST[k] != null ? BEST[k] + '%' : '—'}</b></div>`).join('')}</div></section>`;
  }
  if (QZ.i >= QZ.items.length) return vQuizEnd();
  const it = QZ.items[QZ.i], [t, q, opts, ok, ex] = it.q, ans = QZ.answers[QZ.i], answered = ans != null;
  return `
  <header class="page-h"><p class="kicker">${QZ.topic === 'all' ? 'Simulacro' : TOPIC_NAMES[QZ.topic]} · pregunta ${QZ.i + 1} de ${QZ.items.length}</p></header>
  <div class="bar"><i style="width:${QZ.i / QZ.items.length * 100}%"></i></div>
  <section class="card qz">
    <span class="pill" style="--cat:${catVar(t)}">${TOPIC_NAMES[t]}</span>
    <p class="qz-q">${q}</p>
    <div class="qz-opts">${it.order.map((oi, k) => { let cls = ''; if (answered) cls = oi === ok ? ' right' : oi === ans ? ' wrong' : ' dim'; return `<button type="button" class="opt${cls}" data-act="qz-ans" data-o="${oi}" ${answered ? 'disabled' : ''}><kbd>${k + 1}</kbd><span>${opts[oi]}</span></button>`; }).join('')}</div>
    ${answered ? `<div class="qz-ex ${ans === ok ? 'ok' : 'bad'}"><b>${ans === ok ? 'Bien.' : 'No era esa.'}</b> ${ex}</div><div class="qz-next"><button type="button" class="btn" data-act="qz-next">${QZ.i + 1 < QZ.items.length ? 'Siguiente' : 'Ver resultado'} <kbd>Enter</kbd></button></div>` : ''}
  </section>
  <p class="center"><button type="button" class="link" data-act="qz-quit">Abandonar el quiz</button></p>`;
}

function vQuizEnd() {
  const n = QZ.items.length, right = QZ.items.filter((it, i) => QZ.answers[i] === it.q[3]).length, pct = Math.round(right / n * 100);
  if (!QZ.retry && (BEST[QZ.topic] == null || pct > BEST[QZ.topic])) { BEST[QZ.topic] = pct; store.set('best', BEST); }
  const by = {}; QZ.items.forEach((it, i) => { const t = it.q[0]; by[t] = by[t] || [0, 0]; by[t][1]++; if (QZ.answers[i] === it.q[3]) by[t][0]++; });
  const wrong = QZ.items.filter((it, i) => QZ.answers[i] !== it.q[3]);
  const msg = pct >= 85 ? 'Muy bien. Así se llega al final.' : pct >= 60 ? 'Aprobarías, pero repasá los temas donde fallaste.' : 'Todavía falta: volvé a la teoría de los temas en rojo y repetí los errores.';
  return `
  <header class="page-h"><p class="kicker">Resultado</p><h1>${right} de ${n} <span class="pct ${pct >= 85 ? 'ok' : pct >= 60 ? 'mid' : 'bad'}">${pct}%</span></h1><p class="lede">${msg} Para aprobar el final hace falta el 60%.</p></header>
  <section class="card"><h2>Por tema</h2><div class="best">${Object.entries(by).map(([t, [r, tot]]) => `<div class="${r / tot >= .85 ? 'ok' : r / tot >= .6 ? 'mid' : 'bad'}"><span>${TOPIC_NAMES[t]}</span><b>${r}/${tot}</b></div>`).join('')}</div>
    <div class="row-btns">${wrong.length ? `<button type="button" class="btn" data-act="qz-retry">Repetir los ${wrong.length} errores</button>` : ''}<button type="button" class="btn ghost" data-act="qz-quit">Nuevo quiz</button></div></section>
  ${wrong.length ? `<section class="card"><h2>Para repasar</h2><ol class="wrong-list">${wrong.map(it => `<li><p>${it.q[1]}</p><p class="ok-ans">✓ ${it.q[2][it.q[3]]}</p><p class="muted">${it.q[4]}</p></li>`).join('')}</ol></section>` : ''}`;
}

// ===================== temporizador Ubir =====================
let TM = { left: 105 * 60, id: null };
const tmShow = () => { const e = $('#tm-v'); if (!e) return; const s = TM.left, h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; e.textContent = `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`; e.classList.toggle('low', s <= 600); };

// ===================== router y eventos =====================
const VIEWS = { inicio: vInicio, examen: vExamen, uml: vUML, solid: vSOLID, grasp: vGRASP, patrones: vPatrones, creacionales: () => vCat('cre'), estructurales: () => vCat('est'), comportamiento: () => vCat('com'), senales: vSenales, repaso: vRepaso, tuich: vTuich, ejercicios: vEjercicios, dibujos: vDibujos, teoricas: vTeoricas, flashcards: vFlash, quiz: vQuiz };
let current = 'inicio', pendingScroll = null;

function render(keepScroll) {
  const h = location.hash.slice(1);
  current = VIEWS[h] ? h : 'inicio';
  const y = window.scrollY;
  $('#main').innerHTML = VIEWS[current]();
  renderNav(current);
  if (current === 'examen') jbRender();
  if (current === 'senales') detRun();
  if (current === 'ejercicios') tmShow();
  window.scrollTo(0, keepScroll ? y : 0);
  if (pendingScroll) { const id = pendingScroll; pendingScroll = null; requestAnimationFrame(() => scrollToId(id)); }
}
function scrollToId(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); }

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.got) { GOT[t.dataset.got] = t.checked; store.set('got', GOT); renderNav(current); if (current === 'inicio') render(true); }
  if (t.dataset.ck != null) { CHECK[t.dataset.ck] = t.checked; store.set('check', CHECK); }
  if (t.id === 'fc-deck') { FC.deck = t.value; fcStart(); render(true); }
  if (t.id === 'fc-rev') { FC.rev = t.checked; FC.flipped = false; render(true); }
  if (t.dataset.jb != null) jbRender();
});
document.addEventListener('input', e => {
  if (e.target.dataset.jb != null) jbRender();
  if (e.target.id === 'det-in') { clearTimeout(window._dt); window._dt = setTimeout(detRun, 200); }
});

document.addEventListener('click', e => {
  const sc = e.target.closest('[data-scroll]');
  if (sc) { e.preventDefault(); scrollToId(sc.dataset.scroll); return; }
  const go = e.target.closest('[data-goto]');
  if (go) { e.preventDefault(); pendingScroll = go.dataset.goto || null; const h = go.getAttribute('href').slice(1); if (location.hash.slice(1) === h) render(true); else location.hash = h; return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'extab') { exTab = b.dataset.t; render(true); }
  if (act === 'check-esc') {
    const v = $('#sel-' + i).value, s = SCENARIOS[i], res = $('#res-' + i);
    res.hidden = false;
    if (!v) { res.className = 'ex-res'; res.innerHTML = '<p>Elegí un patrón primero.</p>'; return; }
    const ok = v === s.a || (s.alt || []).includes(v);
    res.className = 'ex-res ' + (ok ? 'ok' : 'bad');
    res.innerHTML = `<p class="verdict">${ok ? 'Correcto.' : 'No. Elegiste ' + pinfo(v).name + '.'}</p>` + solHTML(s);
  }
  if (act === 'show-esc') { const res = $('#res-' + i); res.hidden = false; res.className = 'ex-res'; res.innerHTML = solHTML(SCENARIOS[i]); }
  if (act === 'check-viol') {
    const v = VIOLATIONS[i], ok = b.dataset.v === v.a || (v.alt || []).includes(b.dataset.v), s = SOLID.find(x => x.id === v.a), res = $('#vres-' + i);
    res.hidden = false; res.className = 'ex-res ' + (ok ? 'ok' : 'bad');
    res.innerHTML = `<p class="verdict">${ok ? 'Correcto.' : 'No.'} Viola <b>${s.letter} · ${s.es}</b>.</p><p>${v.why}</p>`;
  }
  if (act === 'jb-copy') {
    const txt = $('#jb-out').innerText, msg = $('#jb-msg');
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = 'Copiado.'; }, () => { msg.textContent = 'No se pudo copiar: seleccioná el texto a mano.'; }); } catch (err) { msg.textContent = 'No se pudo copiar: seleccioná el texto a mano.'; }
  }
  if (act === 'ck-reset') { CHECK = {}; store.set('check', CHECK); render(true); }
  if (act === 'det-load') { $('#det-in').value = b.dataset.k === 'tuich' ? TUICH.text : b.dataset.k === 'ubir' ? UBIR.text : ''; detRun(); }
  if (act === 'teo-all') document.querySelectorAll('details.teo').forEach(d => d.open = b.dataset.v === '1');
  if (act === 'tm-start' && !TM.id) TM.id = setInterval(() => { if (TM.left > 0) TM.left--; else { clearInterval(TM.id); TM.id = null; } tmShow(); }, 1000);
  if (act === 'tm-stop') { clearInterval(TM.id); TM.id = null; }
  if (act === 'tm-reset') { clearInterval(TM.id); TM.id = null; TM.left = 105 * 60; tmShow(); }
  if (act === 'fc-flip') { FC.flipped = !FC.flipped; render(true); }
  if (act === 'fc-yes' && FC.flipped) { FC.queue.shift(); FC.known++; FC.flipped = false; render(true); }
  if (act === 'fc-no' && FC.flipped) { FC.queue.push(FC.queue.shift()); FC.flipped = false; render(true); }
  if (act === 'fc-restart') { fcStart(); render(true); }
  if (act === 'qz-start') { quizStart($('#qz-topic').value, $('#qz-n').value); render(); }
  if (act === 'qz-ans') { QZ.answers[QZ.i] = +b.dataset.o; render(true); }
  if (act === 'qz-next') { QZ.i++; render(); }
  if (act === 'qz-quit') { QZ = null; render(); }
  if (act === 'qz-retry') { const wrong = QZ.items.filter((it, k) => QZ.answers[k] !== it.q[3]).map(it => it.q); quizStart(QZ.topic, 'all', wrong); QZ.retry = true; render(); }
});

document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  if (current === 'flashcards' && FC.queue.length) {
    if (e.key === ' ') { e.preventDefault(); FC.flipped = !FC.flipped; render(true); }
    else if (e.key === 'ArrowRight' && FC.flipped) { FC.queue.shift(); FC.known++; FC.flipped = false; render(true); }
    else if (e.key === 'ArrowLeft' && FC.flipped) { FC.queue.push(FC.queue.shift()); FC.flipped = false; render(true); }
  }
  if (current === 'quiz' && QZ && QZ.i < QZ.items.length) {
    const answered = QZ.answers[QZ.i] != null;
    if (!answered && /^[1-4]$/.test(e.key)) { const it = QZ.items[QZ.i], k = +e.key - 1; if (k < it.order.length) { QZ.answers[QZ.i] = it.order[k]; render(true); } }
    else if (answered && e.key === 'Enter') { e.preventDefault(); QZ.i++; render(); }
  }
});

window.addEventListener('hashchange', () => render());
render();
</script>
</body>
</html>
